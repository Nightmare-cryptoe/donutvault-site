<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonutVault | DonutSMP Marketplace</title>
    <style>
        :root {
            --wood-dark: #3e2723;
            --wood-medium: #5d4037;
            --wood-light: #8d6e63;
            --accent-gold: #ffb300;
            --text-light: #efebe9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(27, 18, 14, 0.9), rgba(27, 18, 14, 0.9)), 
                        url('https://transparenttextures.com');
            background-color: #1a0f0a;
            color: var(--text-light);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            width: 100%;
            background-color: var(--wood-dark);
            border-bottom: 4px solid var(--accent-gold);
            text-align: center;
            padding: 20px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 2.5rem;
            color: var(--accent-gold);
            text-shadow: 2px 2px #000;
            letter-spacing: 2px;
        }

        header p {
            margin: 5px 0 0;
            color: var(--text-light);
            font-style: italic;
            opacity: 0.8;
        }

        .market-container {
            background-color: var(--wood-medium);
            background-image: url('https://transparenttextures.com');
            border: 6px solid var(--wood-dark);
            border-radius: 8px;
            padding: 30px;
            margin-top: 40px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.7);
            text-align: center;
        }

        .section-title {
            font-size: 1.8rem;
            color: var(--accent-gold);
            margin-bottom: 20px;
            text-shadow: 1px 1px #000;
            border-bottom: 2px solid var(--wood-dark);
            padding-bottom: 10px;
        }

        .calculator-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--accent-gold);
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            background-color: #2d1a13;
            border: 2px solid var(--wood-dark);
            border-radius: 4px;
            color: #fff;
            font-size: 1.2rem;
            box-sizing: border-box;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        .unit-label {
            position: absolute;
            right: 15px;
            color: #8d6e63;
            font-weight: bold;
        }

        .price-display {
            background-color: #2d1a13;
            border: 2px dashed var(--accent-gold);
            border-radius: 4px;
            padding: 15px;
            margin: 25px 0;
            font-size: 1.5rem;
            font-weight: bold;
        }

        .price-display span {
            color: var(--accent-gold);
        }

        .order-btn {
            background: linear-gradient(to bottom, #ffa000, #ff6f00);
            border: 2px solid var(--wood-dark);
            border-radius: 4px;
            color: #fff;
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px #b55a00, 0 5px 10px rgba(0,0,0,0.5);
            transition: all 0.1s ease;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .order-btn:hover {
            background: linear-gradient(to bottom, #ffb300, #ff8f00);
        }

        .order-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 #b55a00, 0 2px 5px rgba(0,0,0,0.5);
        }

        .rate-info {
            font-size: 0.9rem;
            opacity: 0.7;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>DONUTVAULT</h1>
        <p>The Most Reliable DonutSMP Currency Exchange</p>
    </header>

    <div class="market-container">
        <div class="section-title">Money Calculator</div>
        
        <div class="calculator-group">
            <label for="amount">Enter DonutSMP Cash Amount:</label>
            <div class="input-container">
                <input type="number" id="amount" value="10" min="1" step="1" oninput="calculatePrice()">
                <span class="unit-label">MILLION</span>
            </div>
        </div>

        <div class="price-display">
            Total Cost: $<span id="total-price">0.31</span>
        </div>

        <!-- REPLACE THE HREF URL BELOW WITH YOUR BILLGANG OR SELL.APP LINK -->
        <a href="https://billgang.com" id="checkout-link" target="_blank" style="text-decoration: none;">
            <button class="order-btn" type="button">🛒 Make Order</button>
        </a>

        <div class="rate-info">
            Current Rate: $0.031 per 1,000,000 (1M) DonutSMP Money
        </div>
    </div>

    <script>
        const ratePerMillion = 0.031;

        function calculatePrice() {
            const amountInput = document.getElementById('amount');
            let amount = parseFloat(amountInput.value);

            // Handle empty or invalid inputs gracefully
            if (isNaN(amount) || amount < 0) {
                amount = 0;
            }

            const totalPrice = amount * ratePerMillion;
            
            // Displays price fixed to 3 decimal places to accommodate precise small fractions
            document.getElementById('total-price').innerText = totalPrice.toFixed(3);
        }
        
        // Run once on load to establish default price
        calculatePrice();
    </script>

</body>
</html>
