<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonutVault | DonutSMP Market</title>
    <style>
        :root {
            --wood-dark: #3E2723;
            --wood-medium: #5D4037;
            --wood-light: #8D6E63;
            --amber-glow: #FFB300;
            --parchment: #F5F5DC;
        }

        body {
            background-color: #1a120b;
            background-image: radial-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.8));
            color: var(--parchment);
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .shop-container {
            background: linear-gradient(135deg, var(--wood-dark), var(--wood-medium));
            border: 8px solid #2d1a10;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7), inset 0 0 20px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            box-sizing: border-box;
            text-align: center;
        }

        h1 {
            color: var(--amber-glow);
            font-size: 2.5rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px #000;
            letter-spacing: 2px;
            border-bottom: 3px double var(--wood-light);
            padding-bottom: 10px;
        }

        .subtitle {
            font-style: italic;
            color: #bcaaa4;
            margin-bottom: 30px;
        }

        .calculator-box {
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--wood-light);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #d7ccc8;
            text-align: left;
        }

        .input-group {
            display: flex;
            align-items: center;
            background: #22150f;
            border: 2px solid var(--wood-light);
            border-radius: 4px;
            padding: 5px 10px;
            margin-bottom: 20px;
        }

        input[type="number"], input[type="text"] {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.2rem;
            width: 100%;
            outline: none;
            padding: 5px;
        }

        .unit-tag {
            color: var(--amber-glow);
            font-weight: bold;
            padding-left: 5px;
        }

        .price-display {
            font-size: 1.8rem;
            color: var(--amber-glow);
            margin: 20px 0;
            text-shadow: 1px 1px 2px #000;
            font-weight: bold;
        }

        .order-btn {
            background: linear-gradient(to bottom, #ffb300, #ff8f00);
            border: 2px solid #ff6f00;
            border-radius: 4px;
            color: #000;
            cursor: pointer;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 12px 30px;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
            transition: all 0.2s ease;
        }

        .order-btn:hover {
            background: linear-gradient(to bottom, #ffca28, #ffb300);
            transform: translateY(-2px);
        }

        .order-btn:active {
            transform: translateY(1px);
        }

        .status-msg {
            margin-top: 15px;
            font-size: 0.95rem;
            min-height: 20px;
        }
    </style>
</head>
<body>

<div class="shop-container">
    <h1>DONUTVAULT</h1>
    <div class="subtitle">Premium DonutSMP Currency Provider</div>

    <div class="calculator-box">
        <label for="amount">Enter Amount to Buy:</label>
        <div class="input-group">
            <input type="number" id="amount" value="10" min="1" step="1">
            <span class="unit-tag">Millions (M)</span>
        </div>

        <label for="discord">Discord Username:</label>
        <div class="input-group">
            <input type="text" id="discord" placeholder="username#0000 or global_name">
        </div>

        <div class="price-display">
            Total Cost: $<span id="total-price">0.31</span>
        </div>
    </div>

    <button class="order-btn" onclick="processOrder()">Make Order</button>
    <div id="status" class="status-msg"></div>
</div>

<script>
    const PRICE_PER_MILLION = 0.031;
    const amountInput = document.getElementById('amount');
    const discordInput = document.getElementById('discord');
    const totalPriceSpan = document.getElementById('total-price');
    const statusDiv = document.getElementById('status');

    function calculatePrice() {
        const amount = parseFloat(amountInput.value) || 0;
        const total = amount * PRICE_PER_MILLION;
        totalPriceSpan.textContent = total.toFixed(3);
    }

    amountInput.addEventListener('input', calculatePrice);

    async function processOrder() {
        const amount = parseFloat(amountInput.value);
        const discord = discordInput.value.trim();

        if (!amount || amount <= 0) {
            showStatus('Please enter a valid amount.', 'red');
            return;
        }
        if (!discord) {
            showStatus('Please enter your Discord username for order delivery.', 'red');
            return;
        }

        showStatus('Creating automated invoice...', 'gold');

        try {
            // Replace with your actual AWS API Gateway or backend processing endpoint
            const response = await fetch('https://donutvault.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount: amount, discord: discord })
            });

            const data = await response.json();

            if (response.ok && data.payment_url) {
                showStatus('Order generated! Redirecting to payment...', 'green');
                window.location.href = data.payment_url;
            } else {
                showStatus(data.error || 'Failed to generate order. Try again.', 'red');
            }
        } catch (error) {
            showStatus('Server connection error. Contact administration.', 'red');
        }
    }

    function showStatus(text, color) {
        statusDiv.textContent = text;
        statusDiv.style.color = color === 'gold' ? 'var(--amber-glow)' : color;
    }
</script>

</body>
</html>
