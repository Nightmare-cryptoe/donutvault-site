<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DonutVault - DonutSMP Marketplace</title>
    <style>
        :root {
            --wood-dark: #3E2723;
            --wood-medium: #5D4037;
            --wood-light: #8D6E63;
            --gold: #FFD700;
            --gold-hover: #FFC107;
            --parchment: #F5F5DC;
            --text-light: #FFF8E1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        body {
            background-color: #2D1A14;
            /* Wooden plank texture simulation */
            background-image: linear-gradient(rgba(0, 0, 0, 0.4) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 0, 0, 0.4) 1px, transparent 1px);
            background-size: 40px 120px;
            color: var(--text-light);
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .marketplace-container {
            background-color: var(--wood-medium);
            border: 8px solid var(--wood-dark);
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 10px 30px rgba(0,0,0,0.7);
            max-width: 550px;
            width: 100%;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            color: var(--gold);
            font-size: 2.5rem;
            text-transform: uppercase;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        .subtitle {
            font-style: italic;
            color: var(--parchment);
            margin-bottom: 25px;
            font-size: 0.95rem;
            text-shadow: 1px 1px 2px #000;
        }

        .shop-sign {
            background-color: var(--wood-dark);
            border: 3px dashed var(--gold);
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 4px;
        }

        .rate-info {
            font-size: 1.1rem;
            color: var(--gold);
            font-weight: bold;
            text-shadow: 1px 1px 1px #000;
        }

        .calculator-box {
            background-color: rgba(0, 0, 0, 0.3);
            border: 2px solid var(--wood-dark);
            border-radius: 6px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
        }

        .calculator-box h2 {
            color: var(--parchment);
            font-size: 1.2rem;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px #000;
            text-transform: uppercase;
            border-bottom: 1px solid var(--wood-light);
            padding-bottom: 5px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        input[type="number"], input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: var(--parchment);
            border: 3px solid var(--wood-dark);
            color: #333;
            font-weight: bold;
            font-size: 1.1rem;
            border-radius: 4px;
            outline: none;
        }

        input:focus {
            border-color: var(--gold);
        }

        .price-display {
            background-color: var(--wood-dark);
            border: 2px solid var(--gold);
            border-radius: 4px;
            padding: 15px;
            text-align: center;
            margin-top: 20px;
        }

        .price-display span {
            display: block;
        }

        .price-label {
            font-size: 0.85rem;
            color: var(--text-light);
            text-transform: uppercase;
        }

        .price-amount {
            font-size: 1.8rem;
            color: var(--gold);
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
            margin-top: 5px;
        }

        .checkout-btn {
            background-color: var(--gold);
            color: var(--wood-dark);
            border: 3px solid var(--wood-dark);
            border-radius: 4px;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 4px 0 var(--wood-dark);
            transition: all 0.1s ease;
        }

        .checkout-btn:hover {
            background-color: var(--gold-hover);
        }

        .checkout-btn:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        footer {
            margin-top: 20px;
            font-size: 0.75rem;
            color: var(--wood-light);
        }
    </style>
</head>
<body>

<div class="marketplace-container">
    <header>
        <h1>DonutVault</h1>
        <div class="subtitle">🪵 Trusted DonutSMP Economy Trading Post 🪵</div>
    </header>

    <div class="shop-sign">
        <span class="rate-info">✨ Current Exchange Rate: 1,000,000 (1M) = \$0.031 ✨</span>
    </div>

    <!-- Money Calculator Form -->
    <div class="calculator-box">
        <h2>💰 Currency Calculator</h2>
        
        <div class="input-group">
            <label for="amount">In-Game Money Amount (in Millions):</label>
            <input type="number" id="amount" value="10" min="1" step="1" oninput="calculatePrice()">
        </div>

        <div class="input-group">
            <label for="ign">Minecraft In-Game Name (IGN):</label>
            <input type="text" id="ign" placeholder="e.g., Stev_Donut" required>
        </div>

        <div class="price-display">
            <span class="price-label">Total Cost (USD)</span>
            <span class="price-amount" id="total-price">\$0.31</span>
        </div>
    </div>

    <button class="checkout-btn" onclick="initiatePaymentoCheckout()">Purchase via Paymento</button>

    <footer>
        &copy; 2026 DonutVault. Not affiliated with DonutSMP or Mojang.
    </footer>
</div>

<script>
    const RATE_PER_MILLION = 0.031;

    function calculatePrice() {
        const amountInput = document.getElementById('amount').value;
        const total = (amountInput * RATE_PER_MILLION).toFixed(3);
        
        // Formats to display standard currency rounding or keep precision
        document.getElementById('total-price').innerText = '\$' + parseFloat(total).toFixed(2);
    }

    function initiatePaymentoCheckout() {
        const amount = document.getElementById('amount').value;
        const ign = document.getElementById('ign').value.trim();
        const finalPrice = (amount * RATE_PER_MILLION).toFixed(3);

        if (!ign) {
            alert("Please enter your Minecraft In-Game Name (IGN) before checking out!");
            return;
        }

        if (amount <= 0) {
            alert("Please enter a valid currency amount!");
            return;
        }

        alert(`Connecting to Paymento...\n\nOrder Info:\nShop: DonutVault\nBuying: ${amount}M DonutSMP Money\nIGN: ${ign}\nTotal: $${parseFloat(finalPrice).toFixed(2)}`);
        
        /* 
           INTEGRATION NOTE FOR PAYMENTO API:
           Replace this block with your actual Paymento gateway redirection payload.
           Typically you will hit their payment link or API creation route:
           
           window.location.href = `https://paymento.org{finalPrice}&custom_fields={"ign":"${ign}","millions":"${amount}"}`;
        */
    }

    // Run calculation once on page load
    calculatePrice();
</script>

</body>
</html>
